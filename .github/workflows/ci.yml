name: CI

on:
  pull_request:
    branches:
      [
        main,
        rc,
        '*-RC',
        feat/plugin-media-broker,
        fix/media-host-settings,
        feat/plugin-settings-cards,
      ]
  push:
    branches: [main, rc]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prettier --check .
      # Use the npm script rather than a bare `eslint src/` so CI and a local
      # `npm run lint:eslint` cannot drift apart. It chains the second,
      # dash-rule-only pass over src/__tests__ and scripts.
      - run: npm run lint:eslint
      - run: npm run lint # TypeScript type checking
      # Agent briefing docs (CLAUDE*.md, docs/agent-guides/) are the first thing
      # every coding agent reads, and CLAUDE.md's list of canonical helpers is a
      # table of import paths. A moved file silently turns those into
      # instructions to import from nowhere, so the paths get checked here
      # rather than in the pre-push hook, which is routinely --no-verify'd past.
      - run: npm run lint:doc-refs

  test:
    name: Test (${{ matrix.os }}, shard ${{ matrix.shard }}/2)
    strategy:
      # Run the suite on both platforms; don't cancel one when the other fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # npm ci prepares Electron native modules; the test runner uses plain Node.
      - if: runner.os != 'Windows'
        run: npm rebuild better-sqlite3 --build-from-source
      # Invoke the pinned binary directly: npm's bundled node-gyp may be too old for VS 2026.
      - if: runner.os == 'Windows'
        run: npm install --prefix "$env:RUNNER_TEMP/maestro-node-gyp" --no-save --ignore-scripts node-gyp@12.1.0
      - if: runner.os == 'Windows'
        working-directory: node_modules/better-sqlite3
        run: node "$env:RUNNER_TEMP/maestro-node-gyp/node_modules/node-gyp/bin/node-gyp.js" rebuild --release
      - run: npm run test -- --shard=${{ matrix.shard }}/2
