name: CI

on:
  pull_request:
    branches:
      [
        main,
        rc,
        '*-RC',
        feat/plugin-media-broker,
        fix/media-host-settings,
        feat/plugin-settings-cards,
      ]
  push:
    branches: [main, rc]

# These jobs use the bundled CPU runtime, not the optional CUDA download.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prettier --check .
      # Use the npm script rather than a bare `eslint src/` so CI and a local
      # `npm run lint:eslint` cannot drift apart. It chains the second,
      # dash-rule-only pass over src/__tests__ and scripts.
      - run: npm run lint:eslint
      - run: npm run lint # TypeScript type checking
      # Agent briefing docs (CLAUDE*.md, docs/agent-guides/) are the first thing
      # every coding agent reads, and CLAUDE.md's list of canonical helpers is a
      # table of import paths. A moved file silently turns those into
      # instructions to import from nowhere, so the paths get checked here
      # rather than in the pre-push hook, which is routinely --no-verify'd past.
      - run: npm run lint:doc-refs

  test:
    name: Test (${{ matrix.os }}, shard ${{ matrix.shard }}/2)
    strategy:
      # Run the suite on both platforms; don't cancel one when the other fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
        env:
          # Windows unit tests use plain Node; keep the native modules built by npm ci.
          MAESTRO_SERVER_INSTALL: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
      - run: npm run rebuild:node-native
        if: matrix.os != 'windows-latest'
      - run: npm run test -- --shard=${{ matrix.shard }}/2
        env:
          # Windows runners keep the workspace and runner.temp on D:, but the default
          # user temp dir is on C:. Keep the suite's many temp files on D:.
          TEMP: ${{ matrix.os == 'windows-latest' && runner.temp || '/tmp' }}
          TMP: ${{ matrix.os == 'windows-latest' && runner.temp || '/tmp' }}
