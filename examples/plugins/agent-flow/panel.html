<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Agent Flow</title>
		<style>
			/* Every colour goes through a custom property so the panel restyles with a
			   single :root override and never hard-codes a hex inline. */
			:root {
				--bg: #0d1117;
				--panel: #161b22;
				--panel2: #1c2128;
				--border: #30363d;
				--text: #c9d1d9;
				--muted: #8b949e;
				--accent: #58a6ff;
				--edge: #444c56;
				--green: #3fb950;
				--yellow: #d29922;
				--red: #f85149;
				--gray: #6e7681;
				--amber: #f0883e;
				--ink: #0d1117;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				background: var(--bg);
				color: var(--text);
				font:
					13px/1.4 -apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					Roboto,
					sans-serif;
				overflow: hidden;
			}
			#app {
				display: flex;
				flex-direction: column;
				height: 100%;
			}
			#hdr {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 6px 10px;
				background: var(--panel);
				border-bottom: 1px solid var(--border);
				flex: 0 0 auto;
			}
			#title {
				font-weight: 600;
				letter-spacing: 0.2px;
				white-space: nowrap;
			}
			#summary {
				display: flex;
				align-items: center;
				gap: 6px;
				flex: 1 1 auto;
				overflow: hidden;
				font-size: 11px;
			}
			#summary .seg {
				padding: 1px 8px;
				border-radius: 10px;
				font-weight: 600;
				white-space: nowrap;
			}
			.seg-working {
				background: rgba(210, 153, 34, 0.18);
				color: var(--yellow);
				border: 1px solid rgba(210, 153, 34, 0.45);
			}
			.seg-waiting {
				background: rgba(88, 166, 255, 0.15);
				color: var(--accent);
				border: 1px solid rgba(88, 166, 255, 0.45);
			}
			.seg-error {
				background: rgba(248, 81, 73, 0.15);
				color: var(--red);
				border: 1px solid rgba(248, 81, 73, 0.5);
			}
			#hint {
				color: var(--muted);
				font-size: 11px;
				white-space: nowrap;
			}
			.btn {
				border: 1px solid var(--border);
				background: var(--panel2);
				color: var(--text);
				padding: 3px 10px;
				border-radius: 6px;
				cursor: pointer;
				flex: 0 0 auto;
				font-size: 12px;
			}
			.btn:hover {
				border-color: var(--accent);
				color: var(--accent);
			}
			#clear:hover {
				border-color: var(--red);
				color: var(--red);
			}
			#graphWrap {
				position: relative;
				flex: 1 1 auto;
				min-height: 0;
			}
			#canvas {
				width: 100%;
				height: 100%;
				display: block;
				cursor: grab;
				touch-action: none;
			}
			#canvas.dragging {
				cursor: grabbing;
			}
			#empty {
				position: absolute;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				color: var(--muted);
				font-size: 14px;
				pointer-events: none;
			}
			#empty.hidden {
				display: none;
			}
			text {
				fill: var(--text);
				user-select: none;
			}
			.agent,
			.sat.done {
				cursor: pointer;
			}
			.agent:hover .core {
				filter: brightness(1.25);
			}
			.sat.done:hover rect {
				filter: brightness(1.15);
			}
			/* Five-colour status language: green ready, yellow thinking, red error,
			   pulsing orange connecting (plus blue "waiting for input" and grey
			   unknown, which the app uses for the same states elsewhere). */
			.k-idle {
				fill: var(--green);
				stroke: var(--green);
			}
			.k-working {
				fill: var(--yellow);
				stroke: var(--yellow);
			}
			.k-connecting {
				fill: var(--amber);
				stroke: var(--amber);
			}
			.k-error {
				fill: var(--red);
				stroke: var(--red);
			}
			.k-waiting {
				fill: var(--accent);
				stroke: var(--accent);
			}
			.k-unknown {
				fill: var(--gray);
				stroke: var(--gray);
			}
			.p-running {
				fill: var(--yellow);
			}
			.p-completed {
				fill: var(--green);
			}
			.p-failed {
				fill: var(--red);
			}
			.p-unknown {
				fill: var(--gray);
			}
			.halo {
				fill: none;
				stroke-width: 2;
				opacity: 0.35;
			}
			.halo.pulsing {
				animation: halo 1.6s ease-out infinite;
			}
			.sat.running rect {
				animation: pulse 1.1s ease-in-out infinite;
			}
			.agent.focused .core {
				stroke-width: 3;
			}
			.focusRing {
				fill: none;
				stroke: var(--accent);
				stroke-width: 1.5;
				stroke-dasharray: 4 4;
				opacity: 0.9;
			}
			@keyframes halo {
				0% {
					transform: scale(1);
					opacity: 0.5;
				}
				100% {
					transform: scale(1.35);
					opacity: 0;
				}
			}
			@keyframes pulse {
				0%,
				100% {
					opacity: 1;
				}
				50% {
					opacity: 0.5;
				}
			}
		</style>
	</head>
	<body>
		<div id="app">
			<header id="hdr">
				<div id="title">Agent Flow</div>
				<div id="summary"></div>
				<div id="hint">Click an agent to jump · wheel to zoom · double-click to reset</div>
				<button id="reset" class="btn" title="Reset the view">Reset view</button>
				<button id="clear" class="btn" title="Clear the graph">Clear</button>
			</header>
			<div id="graphWrap">
				<svg id="canvas" xmlns="http://www.w3.org/2000/svg">
					<g id="viewport"></g>
				</svg>
				<div id="empty">Waiting for agent activity...</div>
			</div>
		</div>
		<script>
			'use strict';
			var SVGNS = 'http://www.w3.org/2000/svg';

			// ---- layout constants ------------------------------------------------
			// One shared canvas: every agent is a node in a grid of cells, with its
			// most recent tool calls orbiting it as satellite cards.
			var CELL_W = 340;
			var CELL_H = 320;
			var NODE_R = 34; // agent core radius
			var HALO_R = 44; // pulsing ring radius
			var SAT_R = 118; // orbit radius of the satellite cards
			var SAT_W = 112;
			var SAT_H = 34;
			var SAT_MAX = 6; // most recent tool calls shown per agent
			var BAR_W = 132; // token bar width
			var STALL_MS = 30000; // amber "no activity" threshold while working

			// ---- state -----------------------------------------------------------
			var latest = null; // most recent snapshot { v, at, lanes, summary, focusedSessionId }
			var view = { tx: 0, ty: 0, scale: 1 }; // pan/zoom, preserved across renders
			var userMoved = false; // once the user pans/zooms, stop auto-fitting
			var contentBox = null; // { w, h } of the laid-out graph, for fitView
			// sessionId -> { g, x, y }: the SVG badge sub-group per agent node and its
			// anchor, so the 1s clock tick can repaint ONLY the badges (elapsed timer,
			// stall warning) without re-rendering the graph and restarting animations.
			var healthGroups = Object.create(null);

			// ---- element refs ----------------------------------------------------
			var canvas = document.getElementById('canvas');
			var viewport = document.getElementById('viewport');
			var emptyEl = document.getElementById('empty');
			var summaryEl = document.getElementById('summary');
			var graphWrap = document.getElementById('graphWrap');

			// ---- helpers ---------------------------------------------------------
			function el(tag, attrs, text) {
				var n = document.createElementNS(SVGNS, tag);
				if (attrs) for (var k in attrs) n.setAttribute(k, attrs[k]);
				if (text != null) n.textContent = text;
				return n;
			}
			function clamp(v, lo, hi) {
				return v < lo ? lo : v > hi ? hi : v;
			}
			function clear(node) {
				while (node.firstChild) node.removeChild(node.firstChild);
			}
			function truncate(s, max) {
				s = String(s == null ? '' : s);
				return s.length > max ? s.slice(0, max - 1) + '…' : s;
			}
			// Format ms as "1.2s" style.
			function fmtDur(ms) {
				if (ms == null || isNaN(ms)) return '-';
				if (ms < 1000) return Math.round(ms) + 'ms';
				var s = ms / 1000;
				if (s < 60) return (s < 10 ? s.toFixed(1) : Math.round(s)) + 's';
				var m = Math.floor(s / 60);
				return m + 'm ' + Math.round(s % 60) + 's';
			}
			function fmtCost(n) {
				if (typeof n !== 'number' || !isFinite(n) || n <= 0) return null;
				return '$' + n.toFixed(n < 1 ? 4 : 2);
			}
			// Compact token count: 1.2k / 3.4M.
			function fmtTokens(n) {
				if (typeof n !== 'number' || !isFinite(n) || n <= 0) return '0';
				if (n < 1000) return String(Math.round(n));
				if (n < 1000000) return (n / 1000).toFixed(n < 10000 ? 1 : 0) + 'k';
				return (n / 1000000).toFixed(1) + 'M';
			}
			function num(v) {
				return typeof v === 'number' && isFinite(v) ? v : 0;
			}

			// Classify a tool-call node into a phase colour bucket.
			function nodePhase(node) {
				if (node.endedAt == null) return 'running';
				var p = String(node.phase || '').toLowerCase();
				if (p.indexOf('fail') >= 0 || p.indexOf('error') >= 0 || p.indexOf('abort') >= 0)
					return 'failed';
				if (
					p.indexOf('complet') >= 0 ||
					p.indexOf('success') >= 0 ||
					p.indexOf('finish') >= 0 ||
					p === 'done' ||
					p === 'ok' ||
					p === 'end' ||
					p === 'ended'
				)
					return 'completed';
				if (p === 'running' || p === 'started' || p === 'start' || p === 'in_progress')
					return 'running';
				return 'unknown';
			}

			// ---- lane health (metadata only) -------------------------------------
			// Everything below is derived from coarse status, counts and timing. Never
			// thinking prose, tool arguments, or tool output.

			function isTerminalStatus(s) {
				return (
					s === 'completed' ||
					s === 'failed' ||
					s === 'cancelled' ||
					s === 'interrupted' ||
					s === 'error' ||
					s === 'exited'
				);
			}

			// A lane is "working" when the agent is actively running: a coarse
			// busy/connecting status, or a tool still in flight (status can lag).
			// Awaiting-input and terminal states are not working.
			function isWorking(lane) {
				if (lane.awaiting) return false;
				var s = String(lane.status || '').toLowerCase();
				if (s === 'waiting_input') return false;
				if (isTerminalStatus(s)) return false;
				if (s === 'busy' || s === 'connecting') return true;
				return (lane.runningToolCount || 0) > 0;
			}

			// Colour bucket for the node, in the app's five-colour status language.
			function statusKind(lane) {
				if (lane.awaiting) return 'waiting';
				var s = String(lane.status || '').toLowerCase();
				if (s === 'waiting_input') return 'waiting';
				if (s === 'error' || s === 'failed') return 'error';
				if (lane.lastError) return 'error';
				if (s === 'connecting') return 'connecting';
				if (s === 'busy') return 'working';
				if (s === 'idle' || s === 'completed' || s === 'exited') return 'idle';
				if (isWorking(lane)) return 'working';
				return s ? 'unknown' : 'idle';
			}

			function statusLabel(lane) {
				if (lane.awaiting) return 'Waiting for input';
				var s = String(lane.status || '').toLowerCase();
				if (s === 'waiting_input') return 'Waiting for input';
				if (s === 'connecting') return 'Connecting';
				if (s === 'busy') return 'Working';
				if (s === 'idle') return 'Idle';
				if (s === 'completed') return 'Completed';
				if (s === 'failed') return 'Failed';
				if (s === 'error') return 'Error';
				if (s === 'exited') return 'Exited';
				if (s === 'cancelled') return 'Cancelled';
				if (s === 'interrupted') return 'Interrupted';
				if (isWorking(lane)) return 'Working';
				return lane.status ? lane.status : 'Idle';
			}

			function badgeColor(kind) {
				switch (kind) {
					case 'working':
					case 'tools':
						return 'var(--yellow)';
					case 'connecting':
					case 'stall':
						return 'var(--amber)';
					case 'waiting':
						return 'var(--accent)';
					case 'idle':
						return 'var(--green)';
					case 'error':
						return 'var(--red)';
					case 'elapsed':
					default:
						return 'var(--gray)';
				}
			}

			// Draw one rounded pill badge centred on `cx` at `topY`; returns its width.
			function svgBadge(parent, cx, topY, text, kind) {
				var w = Math.max(18, Math.round(String(text).length * 5.6 + 12));
				parent.appendChild(
					el('rect', {
						x: cx - w / 2,
						y: topY,
						width: w,
						height: 15,
						rx: 7.5,
						fill: badgeColor(kind),
						opacity: 0.92,
					})
				);
				parent.appendChild(
					el(
						'text',
						{
							x: cx,
							y: topY + 11,
							'text-anchor': 'middle',
							'font-size': 9.5,
							'font-weight': 600,
							fill: 'var(--ink)',
						},
						text
					)
				);
				return w;
			}

			// Repaint the badge sub-group for one agent against the live clock. Called
			// both during a full render and on the 1s tick (badges only).
			function paintNodeHealth(entry, lane) {
				var g = entry.g;
				clear(g);
				var working = isWorking(lane);
				var hasClock = typeof lane.lastActivityAt === 'number' && isFinite(lane.lastActivityAt);
				var idleMs = hasClock ? Math.max(0, Date.now() - lane.lastActivityAt) : 0;

				var label = truncate(statusLabel(lane), 18);
				if (working && hasClock) label += ' · ' + Math.round(idleMs / 1000) + 's';
				svgBadge(g, entry.x, entry.y, label, statusKind(lane));

				var y2 = entry.y + 19;
				if (working && hasClock && idleMs > STALL_MS) {
					svgBadge(g, entry.x, y2, 'No activity for ' + Math.round(idleMs / 1000) + 's', 'stall');
					y2 += 19;
				}
				if (lane.lastError) {
					var et = truncate(String(lane.lastError.errorType || 'error'), 14);
					svgBadge(
						g,
						entry.x,
						y2,
						et + ' · ' + (lane.lastError.recoverable ? 'retrying' : 'needs attention'),
						'error'
					);
				}
			}

			// The header activity strip: fleet-wide counts from snapshot.summary.
			function renderSummary() {
				clear(summaryEl);
				var s = latest && latest.summary ? latest.summary : null;
				if (!s) return;
				var segs = [];
				if (s.busyLanes > 0) segs.push({ t: s.busyLanes + ' working', c: 'working' });
				if (s.runningTools > 0)
					segs.push({
						t: s.runningTools + (s.runningTools === 1 ? ' tool running' : ' tools running'),
						c: 'working',
					});
				if (s.awaitingLanes > 0) segs.push({ t: s.awaitingLanes + ' waiting', c: 'waiting' });
				if (s.erroredLanes > 0)
					segs.push({
						t: s.erroredLanes + (s.erroredLanes === 1 ? ' error' : ' errors'),
						c: 'error',
					});
				for (var i = 0; i < segs.length; i++) {
					var span = document.createElement('span');
					span.className = 'seg seg-' + segs[i].c;
					span.textContent = segs[i].t;
					summaryEl.appendChild(span);
				}
			}

			function lanesOf() {
				return latest && Array.isArray(latest.lanes) ? latest.lanes : [];
			}

			// ---- jump ------------------------------------------------------------
			// One-way command bridge back to the sandbox. `jump` is the only call that
			// carries args, and they are ids only.
			function invoke(commandId, args) {
				parent.postMessage(
					{ type: 'maestro:invokeCommand', commandId: commandId, args: args },
					'*'
				);
			}
			function jumpTo(sessionId) {
				if (!sessionId) return;
				invoke('jump', { sessionId: sessionId });
			}

			// ---- transform -------------------------------------------------------
			function applyTransform() {
				viewport.setAttribute(
					'transform',
					'translate(' + view.tx + ',' + view.ty + ') scale(' + view.scale + ')'
				);
			}

			// Centre the laid-out graph in the viewport at a sane zoom. Only runs while
			// the user has not panned or zoomed themselves.
			function fitView() {
				if (userMoved || !contentBox) return;
				var w = graphWrap.clientWidth || 900;
				var h = graphWrap.clientHeight || 600;
				var scale = clamp(Math.min(w / (contentBox.w + 40), h / (contentBox.h + 40)), 0.35, 1);
				view.scale = scale;
				view.tx = (w - contentBox.w * scale) / 2;
				view.ty = (h - contentBox.h * scale) / 2;
				applyTransform();
			}

			// ---- agent node ------------------------------------------------------

			// The satellites orbit the upper half and the sides, leaving the arc below
			// the node free for the title, cost pill and token bar.
			function satelliteAngle(i, count) {
				if (count <= 1) return -Math.PI / 2;
				var from = (-200 * Math.PI) / 180;
				var to = (20 * Math.PI) / 180;
				return from + (i * (to - from)) / (count - 1);
			}

			function renderSatellites(g, lane, cx, cy) {
				var nodes = Array.isArray(lane.nodes) ? lane.nodes : [];
				var shown = nodes.length > SAT_MAX ? nodes.slice(nodes.length - SAT_MAX) : nodes;
				for (var i = 0; i < shown.length; i++) {
					var node = shown[i];
					var a = satelliteAngle(i, shown.length);
					var sx = cx + SAT_R * Math.cos(a);
					var sy = cy + SAT_R * Math.sin(a);
					var phase = nodePhase(node);
					var finished = node.endedAt != null;

					// Thin edge from the node rim out to the card.
					g.appendChild(
						el('line', {
							x1: cx + NODE_R * Math.cos(a),
							y1: cy + NODE_R * Math.sin(a),
							x2: sx,
							y2: sy,
							stroke: 'var(--edge)',
							'stroke-width': 1.2,
							opacity: 0.8,
						})
					);

					var card = document.createElementNS(SVGNS, 'g');
					card.setAttribute('class', 'sat ' + (finished ? 'done' : 'running'));
					card.appendChild(
						el('rect', {
							x: sx - SAT_W / 2,
							y: sy - SAT_H / 2,
							width: SAT_W,
							height: SAT_H,
							rx: 7,
							class: 'p-' + phase,
							opacity: 0.94,
						})
					);
					// Name + phase/duration ONLY - never arguments or output.
					card.appendChild(
						el(
							'text',
							{
								x: sx,
								y: sy - 2,
								'text-anchor': 'middle',
								'font-size': 11.5,
								'font-weight': 600,
								fill: 'var(--ink)',
							},
							truncate(node.toolName || 'tool', 15)
						)
					);
					card.appendChild(
						el(
							'text',
							{
								x: sx,
								y: sy + 10,
								'text-anchor': 'middle',
								'font-size': 9.5,
								fill: 'var(--ink)',
								opacity: 0.75,
							},
							phase + (finished ? ' · ' + fmtDur(node.durationMs) : '')
						)
					);
					if (finished) {
						(function (sid) {
							card.addEventListener('click', function () {
								jumpTo(sid);
							});
						})(lane.sessionId);
					}
					g.appendChild(card);
				}
			}

			function renderUsage(g, lane, cx, cy) {
				var u = lane.usage;
				if (!u) return;
				var total =
					num(u.inputTokens) +
					num(u.outputTokens) +
					num(u.cacheReadInputTokens) +
					num(u.cacheCreationInputTokens);
				var cost = fmtCost(u.totalCostUsd);
				var barY = cy + 96;

				if (cost) svgBadge(g, cx, cy + 76, cost, 'idle');

				// Token bar: filled fraction of the context window when known, otherwise
				// a plain count with no bar to imply a capacity we do not have.
				var window_ = num(u.contextWindow);
				var label = fmtTokens(total) + ' tokens';
				if (window_ > 0) {
					var frac = clamp(total / window_, 0, 1);
					g.appendChild(
						el('rect', {
							x: cx - BAR_W / 2,
							y: barY,
							width: BAR_W,
							height: 6,
							rx: 3,
							fill: 'var(--panel2)',
							stroke: 'var(--border)',
						})
					);
					g.appendChild(
						el('rect', {
							x: cx - BAR_W / 2,
							y: barY,
							width: Math.max(2, BAR_W * frac),
							height: 6,
							rx: 3,
							fill: frac > 0.9 ? 'var(--red)' : frac > 0.7 ? 'var(--amber)' : 'var(--accent)',
						})
					);
					label += ' / ' + fmtTokens(window_);
				}
				g.appendChild(
					el(
						'text',
						{
							x: cx,
							y: barY + (window_ > 0 ? 19 : 6),
							'text-anchor': 'middle',
							'font-size': 10,
							fill: 'var(--muted)',
						},
						label
					)
				);
			}

			function renderAgent(lane, cx, cy, focused) {
				var g = document.createElementNS(SVGNS, 'g');
				g.setAttribute('class', 'agent' + (focused ? ' focused' : ''));
				g.setAttribute('data-session', lane.sessionId);
				var kind = statusKind(lane);

				// Satellites first so their edges sit under the core.
				renderSatellites(g, lane, cx, cy);

				// Pulsing halo while the agent is doing something.
				var halo = el('circle', {
					cx: cx,
					cy: cy,
					r: HALO_R,
					class: 'halo k-' + kind + (kind === 'working' || kind === 'connecting' ? ' pulsing' : ''),
				});
				halo.setAttribute('style', 'transform-origin:' + cx + 'px ' + cy + 'px');
				g.appendChild(halo);

				if (focused)
					g.appendChild(el('circle', { cx: cx, cy: cy, r: HALO_R + 8, class: 'focusRing' }));

				var core = el('circle', {
					cx: cx,
					cy: cy,
					r: NODE_R,
					class: 'core k-' + kind,
					'fill-opacity': 0.16,
					'stroke-width': 2,
				});
				g.appendChild(core);

				// Inside the core: running tool count, or a dash when idle.
				var rtc = lane.runningToolCount || 0;
				g.appendChild(
					el(
						'text',
						{
							x: cx,
							y: cy + 6,
							'text-anchor': 'middle',
							'font-size': 17,
							'font-weight': 700,
							class: 'k-' + kind,
							stroke: 'none',
						},
						rtc > 0 ? String(rtc) : '·'
					)
				);

				// Identity below the node: title, then agent id.
				g.appendChild(
					el(
						'text',
						{ x: cx, y: cy + 54, 'text-anchor': 'middle', 'font-size': 12.5, 'font-weight': 600 },
						truncate(lane.title || lane.sessionId, 24)
					)
				);
				g.appendChild(
					el(
						'text',
						{ x: cx, y: cy + 68, 'text-anchor': 'middle', 'font-size': 10.5, fill: 'var(--muted)' },
						truncate(lane.agentId || '', 26)
					)
				);

				renderUsage(g, lane, cx, cy);

				// Health badges (status / elapsed / stall / error), repainted on the tick.
				var hg = document.createElementNS(SVGNS, 'g');
				hg.setAttribute('class', 'health');
				g.appendChild(hg);
				var entry = { g: hg, x: cx, y: cy + 118 };
				healthGroups[lane.sessionId] = entry;
				paintNodeHealth(entry, lane);

				(function (sid) {
					g.addEventListener('click', function () {
						jumpTo(sid);
					});
				})(lane.sessionId);
				return g;
			}

			// ---- graph -----------------------------------------------------------
			function renderGraph() {
				clear(viewport);
				healthGroups = Object.create(null);
				var lanes = lanesOf();
				emptyEl.classList.toggle('hidden', lanes.length > 0);
				if (!lanes.length) {
					contentBox = null;
					return;
				}

				var cols = Math.max(1, Math.ceil(Math.sqrt(lanes.length)));
				var rows = Math.ceil(lanes.length / cols);
				var focusedId = latest && latest.focusedSessionId ? latest.focusedSessionId : '';
				for (var i = 0; i < lanes.length; i++) {
					var cx = (i % cols) * CELL_W + CELL_W / 2;
					var cy = Math.floor(i / cols) * CELL_H + CELL_H / 2;
					viewport.appendChild(renderAgent(lanes[i], cx, cy, lanes[i].sessionId === focusedId));
				}
				contentBox = { w: cols * CELL_W, h: rows * CELL_H };
				fitView();
				applyTransform();
			}

			function render() {
				renderSummary();
				renderGraph();
			}

			// A genuinely stalled or errored agent emits NO further host events, so no
			// new snapshot arrives. Tick the live clock every second and repaint ONLY
			// the summary strip and the per-node badges (never the SVG graph) so the
			// elapsed timer and stall warning keep advancing between snapshots - and
			// the node animations are not restarted every second.
			function refreshHealth() {
				renderSummary();
				var lanes = lanesOf();
				for (var i = 0; i < lanes.length; i++) {
					var entry = healthGroups[lanes[i].sessionId];
					if (entry) paintNodeHealth(entry, lanes[i]);
				}
			}
			setInterval(refreshHealth, 1000);

			// ---- pan / zoom ------------------------------------------------------
			var dragging = false;
			var dragMoved = false;
			var startX = 0;
			var startY = 0;
			var startTx = 0;
			var startTy = 0;

			canvas.addEventListener('pointerdown', function (e) {
				// Only pan when the press lands on empty canvas, not an agent or card.
				if (e.target.closest && e.target.closest('.agent')) return;
				dragging = true;
				dragMoved = false;
				startX = e.clientX;
				startY = e.clientY;
				startTx = view.tx;
				startTy = view.ty;
				canvas.classList.add('dragging');
				if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
			});
			canvas.addEventListener('pointermove', function (e) {
				if (!dragging) return;
				var dx = e.clientX - startX;
				var dy = e.clientY - startY;
				if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
					dragMoved = true;
					userMoved = true;
				}
				view.tx = startTx + dx;
				view.ty = startTy + dy;
				applyTransform();
			});
			canvas.addEventListener('pointerup', function (e) {
				if (!dragging) return;
				dragging = false;
				canvas.classList.remove('dragging');
				try {
					if (canvas.releasePointerCapture) canvas.releasePointerCapture(e.pointerId);
				} catch (err) {
					/* pointer already released */
				}
			});
			// A drag that ends on a node must not also fire the jump.
			canvas.addEventListener(
				'click',
				function (e) {
					if (!dragMoved) return;
					e.stopPropagation();
					e.preventDefault();
				},
				true
			);
			canvas.addEventListener(
				'wheel',
				function (e) {
					e.preventDefault();
					userMoved = true;
					var rect = canvas.getBoundingClientRect();
					var cx = e.clientX - rect.left;
					var cy = e.clientY - rect.top;
					var factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
					var ns = clamp(view.scale * factor, 0.2, 3);
					var k = ns / view.scale;
					view.tx = cx - (cx - view.tx) * k;
					view.ty = cy - (cy - view.ty) * k;
					view.scale = ns;
					applyTransform();
				},
				{ passive: false }
			);
			canvas.addEventListener('dblclick', function () {
				resetView();
			});

			function resetView() {
				userMoved = false;
				view = { tx: 0, ty: 0, scale: 1 };
				fitView();
				applyTransform();
			}

			// ---- header wiring ---------------------------------------------------
			document.getElementById('clear').addEventListener('click', function () {
				invoke('clear');
			});
			document.getElementById('reset').addEventListener('click', resetView);

			// Escape inside the guest cannot reach the host's modal layer stack (this is
			// a separate renderer process), so dismiss the overlay through the plugin's
			// own toggle command instead.
			document.addEventListener('keydown', function (e) {
				if (e.key === 'Escape') invoke('overlay');
			});

			// The sandbox pushes snapshots only on activity, and a push reaches only a
			// mounted panel. Ask for the current snapshot on load (and whenever this
			// panel becomes visible again) so an overlay summoned after activity ended
			// fills in immediately instead of showing the empty state forever.
			invoke('sync');
			document.addEventListener('visibilitychange', function () {
				if (!document.hidden) invoke('sync');
			});

			// ---- inbound snapshots ----------------------------------------------
			window.addEventListener('message', function (e) {
				var d = e.data;
				if (!d || d.type !== 'maestro:panelData') return;
				latest = d.data || null;
				render();
			});

			window.addEventListener('resize', function () {
				fitView();
			});

			// Initial paint (empty state until the first snapshot).
			render();
		</script>
	</body>
</html>
