<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Kanban Board</title>
		<style>
			:root {
				color-scheme: light dark;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
			}
			body {
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
				background: var(--maestro-bg-main, #1e1e1e);
				color: var(--maestro-text-main, #e6e6e6);
				height: 100%;
				overflow: hidden;
				display: flex;
				flex-direction: column;
			}
			/* The board switcher lives here, outside #board, so it survives the
			   empty state: a board with no cards must still be nameable and
			   switchable away from. */
			#header {
				flex: 0 0 auto;
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 10px 12px;
				border-bottom: 1px solid var(--maestro-border, #3c3c3c);
				user-select: none;
			}
			#board-name {
				font-size: 13px;
				font-weight: 600;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			#board-count {
				font-size: 11px;
				color: var(--maestro-text-dim, #9d9d9d);
			}
			#board-switcher {
				margin-left: auto;
				max-width: 260px;
				padding: 3px 6px;
				font: inherit;
				font-size: 12px;
				color: var(--maestro-text-main, #e6e6e6);
				background: var(--maestro-bg-activity, #2d2d2d);
				border: 1px solid var(--maestro-border, #3c3c3c);
				border-radius: 6px;
				cursor: pointer;
			}
			#board {
				display: flex;
				flex-direction: row;
				align-items: stretch;
				gap: 12px;
				padding: 12px;
				flex: 1;
				min-height: 0;
				overflow-x: auto;
				user-select: none;
			}
			.column {
				flex: 0 0 240px;
				display: flex;
				flex-direction: column;
				background: var(--maestro-bg-sidebar, #252526);
				border: 1px solid var(--maestro-border, #3c3c3c);
				border-radius: 8px;
				min-height: 0;
				max-height: 100%;
			}
			.column-header {
				padding: 8px 10px;
				font-weight: 600;
				font-size: 12px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				color: var(--maestro-text-dim, #9d9d9d);
				border-bottom: 1px solid var(--maestro-border, #3c3c3c);
				display: flex;
				justify-content: space-between;
				flex: 0 0 auto;
			}
			.column-count {
				background: var(--maestro-bg-activity, #2d2d2d);
				border-radius: 10px;
				padding: 0 6px;
				font-size: 11px;
			}
			.column-count.over-limit {
				background: var(--maestro-warning, #e5c07b);
				color: var(--maestro-bg-main, #1e1e1e);
				font-weight: 600;
			}
			.column-body {
				flex: 1;
				overflow-y: auto;
				padding: 8px;
				display: flex;
				flex-direction: column;
				gap: 8px;
			}
			.card {
				background: var(--maestro-bg-activity, #2d2d2d);
				border: 1px solid var(--maestro-border, #3c3c3c);
				border-radius: 6px;
				padding: 8px 10px;
				cursor: pointer;
			}
			.card:hover {
				border-color: var(--maestro-accent, #4a9eff);
			}
			.card[draggable='true'] {
				cursor: grab;
			}
			.card.dragging {
				opacity: 0.4;
				cursor: grabbing;
			}
			/* The keyboard's selection. An outline rather than a border color so
			   it reads on top of the hover border and cannot shift the card's
			   layout when it appears. */
			.card.selected {
				outline: 2px solid var(--maestro-accent, #4a9eff);
				outline-offset: 1px;
			}
			/* A legal drop target lights up; an illegal one dims to a clearly
			   non-interactive state. Dimming is the only signal the user gets
			   that the drop will be refused, so it is deliberately heavy. */
			.column.drop-legal {
				border-color: var(--maestro-accent, #4a9eff);
			}
			.column.drop-illegal {
				opacity: 0.3;
				filter: grayscale(1);
			}
			.column.drop-illegal .card {
				cursor: not-allowed;
			}
			.column.read-only .column-header {
				font-style: italic;
			}
			/* Where the card would land, shown while the drag is still in
			   flight rather than inferred after the drop. */
			.drop-placeholder {
				flex: 0 0 auto;
				height: 3px;
				border-radius: 2px;
				background: var(--maestro-accent, #4a9eff);
			}
			.card-title {
				font-size: 13px;
				font-weight: 500;
				display: flex;
				align-items: center;
				gap: 6px;
				user-select: text;
			}
			.status-dot {
				width: 8px;
				height: 8px;
				border-radius: 50%;
				flex: 0 0 auto;
			}
			.card-meta {
				margin-top: 4px;
				font-size: 11px;
				color: var(--maestro-text-dim, #9d9d9d);
				display: flex;
				justify-content: space-between;
				gap: 8px;
				user-select: text;
			}
			.card-project {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.card-activity {
				flex: 0 0 auto;
				white-space: nowrap;
			}
			.empty-state {
				margin: auto;
				max-width: 320px;
				text-align: center;
				color: var(--maestro-text-dim, #9d9d9d);
				padding: 32px;
				user-select: text;
			}
			.write-default-board-button {
				margin-top: 16px;
				padding: 6px 14px;
				border: none;
				border-radius: 6px;
				background: var(--maestro-accent, #4a9eff);
				color: var(--maestro-bg-main, #1e1e1e);
				font-size: 12px;
				font-weight: 600;
				cursor: pointer;
			}
			.write-default-board-button:hover {
				opacity: 0.9;
			}
			#banner {
				margin: 12px 12px 0 12px;
				padding: 8px 10px;
				border-radius: 6px;
				background: var(--maestro-error, #e06c75);
				color: var(--maestro-bg-main, #1e1e1e);
				font-size: 12px;
				user-select: text;
			}
			#banner[hidden] {
				display: none;
			}
			/* Not an error: the global board has no file yet, so nothing is
			   mapped. Same slot, deliberately not alarm-colored. */
			#banner.banner-notice {
				background: var(--maestro-bg-activity, #2d2d2d);
				color: var(--maestro-text-main, #e6e6e6);
				border: 1px solid var(--maestro-border, #3c3c3c);
			}
			.banner-path {
				opacity: 0.85;
				margin-left: 6px;
			}
			#toast {
				position: fixed;
				left: 12px;
				right: 12px;
				bottom: 12px;
				padding: 8px 10px;
				border-radius: 6px;
				background: var(--maestro-error, #e06c75);
				color: var(--maestro-bg-main, #1e1e1e);
				font-size: 12px;
				cursor: pointer;
				user-select: text;
			}
			#toast[hidden] {
				display: none;
			}
		</style>
	</head>
	<body>
		<div id="header">
			<span id="board-name">Kanban Board</span>
			<span id="board-count"></span>
			<select id="board-switcher" aria-label="Board"></select>
		</div>
		<div id="banner" hidden></div>
		<div id="toast" hidden></div>
		<div id="board">
			<div class="empty-state">
				Waiting for the board to load. Open an AI tab in Maestro to see it appear here.
			</div>
		</div>
		<script>
			(function () {
				// Maestro's state colors (see CLAUDE.md "Agent States"): green ready,
				// yellow thinking/busy, red error, orange connecting. There is no
				// single host-injected "connecting" variable (the real app derives it
				// by blending warning and error), so it is approximated the same way
				// with color-mix, falling back to a plain hex on older engines.
				var READY_COLOR = 'var(--maestro-success, #98c379)';
				var BUSY_COLOR = 'var(--maestro-warning, #e5c07b)';
				var ERROR_COLOR = 'var(--maestro-error, #e06c75)';
				var CONNECTING_COLOR =
					'color-mix(in srgb, var(--maestro-warning, #e5c07b), var(--maestro-error, #e06c75) 55%)';

				function statusColor(status) {
					if (status === 'error') return ERROR_COLOR;
					if (status === 'connecting') return CONNECTING_COLOR;
					if (status === 'busy' || status === 'thinking') return BUSY_COLOR;
					return READY_COLOR;
				}

				function basename(path) {
					if (typeof path !== 'string' || !path) return '';
					var trimmed = path.replace(/[\\/]+$/, '');
					var parts = trimmed.split(/[\\/]/);
					return parts[parts.length - 1] || trimmed;
				}

				function relativeTime(ms) {
					if (typeof ms !== 'number' || !isFinite(ms)) return '';
					var diff = Date.now() - ms;
					if (diff < 0) diff = 0;
					var sec = Math.round(diff / 1000);
					if (sec < 5) return 'just now';
					if (sec < 60) return sec + 's ago';
					var min = Math.round(sec / 60);
					if (min < 60) return min + 'm ago';
					var hr = Math.round(min / 60);
					if (hr < 24) return hr + 'h ago';
					var day = Math.round(hr / 24);
					return day + 'd ago';
				}

				// -------------------------------------------------------------
				// Phase 03 drag and drop.
				//
				// The drag handle is the card surface itself, and a card carries
				// no <button>, <input>, or other form control on purpose: a form
				// control under the cursor kills an HTML5 drag outright, so a card
				// stays a plain stack of <div>/<span> (the empty state's
				// write-default-board <button> is fine - it is never inside a
				// draggable surface, and the invariant is asserted in
				// src/__tests__/plugins/kanban-panel.test.ts).
				//
				// The panel's own legality check is advisory. It dims the columns
				// a card cannot reach and refuses their drops so a drop is never
				// offered where it would fail, but the sandbox re-checks every
				// move and can still reject one. A rejection arrives on the next
				// snapshot as `moveRejection`, never as a reply to the post: the
				// panel bridge is one-way by design (see PANEL_DATA_CHANNEL in
				// src/shared/plugins/panel-host.ts).
				// -------------------------------------------------------------

				var DRAG_MIME = 'application/x-maestro-kanban-card';
				// How long an un-acknowledged optimistic move keeps overriding
				// incoming snapshots before the panel gives up and trusts the
				// sandbox, so a dropped command cannot strand a card forever.
				var PENDING_MOVE_TTL_MS = 8000;
				var TOAST_MS = 6000;
				// A real browser does not fire `click` after a drag, but a drag
				// cancelled before it ever left the card can, and that click must
				// not jump the user to the agent they were only trying to move.
				var CLICK_AFTER_DRAG_MS = 250;

				/** Last snapshot actually rendered, including any optimistic move
				 * projected onto it. Every legality and index decision reads this
				 * rather than the DOM. */
				var currentSnapshot = null;
				/** Non-null only between dragstart and dragend/drop. */
				var dragState = null;
				/** The one outstanding optimistic move awaiting reconciliation. */
				var pendingMove = null;
				/** A snapshot that arrived mid-drag; applied once the drag ends so
				 * a refresh can never yank the card out from under the cursor. */
				var deferredSnapshot = null;
				var toastTimer = null;
				var dragEndedAt = 0;
				/** cardKey -> .card element, rebuilt by every render(). */
				var cardNodes = Object.create(null);
				/** columnId -> .column element / .column-body element. */
				var columnNodes = Object.create(null);
				var columnBodies = Object.create(null);

				function snapshotColumns(snapshot) {
					return snapshot && Array.isArray(snapshot.columns) ? snapshot.columns : [];
				}

				function columnById(snapshot, columnId) {
					var columns = snapshotColumns(snapshot);
					for (var i = 0; i < columns.length; i++) {
						if (columns[i] && columns[i].id === columnId) return columns[i];
					}
					return null;
				}

				function locateCard(snapshot, key) {
					var columns = snapshotColumns(snapshot);
					for (var i = 0; i < columns.length; i++) {
						var cards = columns[i] && Array.isArray(columns[i].cards) ? columns[i].cards : [];
						for (var j = 0; j < cards.length; j++) {
							if (cards[j] && cards[j].key === key) {
								return { columnId: columns[i].id, index: j, card: cards[j] };
							}
						}
					}
					return null;
				}

				/** The cards of a column the panel actually draws. A card with no
				 * sessionId/tabId cannot be focused or moved, so render() skips it -
				 * and the keyboard reads this same list, so it can never select a
				 * card that is not on screen. */
				function renderableCards(column) {
					var list = column && Array.isArray(column.cards) ? column.cards : [];
					return list.filter(function (card) {
						return card && typeof card.sessionId === 'string' && typeof card.tabId === 'string';
					});
				}

				function boardIdOf(snapshot) {
					return snapshot && typeof snapshot.boardId === 'string' && snapshot.boardId
						? snapshot.boardId
						: null;
				}

				/** The column ids this card may be dropped on: the sandbox's own
				 * `card.legalColumnIds` when the snapshot carries one, every
				 * writable column otherwise. A read-only column (the global
				 * board's Unmapped lane) is never a legal target. */
				function legalColumnIdsFor(snapshot, card) {
					var declared = card && Array.isArray(card.legalColumnIds) ? card.legalColumnIds : null;
					var ids = [];
					snapshotColumns(snapshot).forEach(function (column) {
						if (!column || typeof column.id !== 'string') return;
						if (column.readOnly === true) return;
						if (declared && declared.indexOf(column.id) === -1) return;
						ids.push(column.id);
					});
					return ids;
				}

				function hideToast() {
					var toast = document.getElementById('toast');
					if (!toast) return;
					toast.hidden = true;
					toast.textContent = '';
				}

				function showToast(message) {
					var toast = document.getElementById('toast');
					if (!toast) return;
					toast.textContent = message;
					toast.hidden = false;
					if (toastTimer) clearTimeout(toastTimer);
					toastTimer = setTimeout(function () {
						toastTimer = null;
						hideToast();
					}, TOAST_MS);
				}

				function removePlaceholder() {
					var el = document.getElementById('drop-placeholder');
					if (el && el.parentNode) el.parentNode.removeChild(el);
				}

				function placeholderElement() {
					var el = document.getElementById('drop-placeholder');
					if (!el) {
						el = document.createElement('div');
						el.id = 'drop-placeholder';
						el.className = 'drop-placeholder';
					}
					return el;
				}

				/** The cards currently drawn in a column, excluding the one being
				 * dragged (it is about to leave) and the placeholder. */
				function cardNodesIn(columnId) {
					var body = columnBodies[columnId];
					var out = [];
					if (!body) return out;
					for (var i = 0; i < body.children.length; i++) {
						var child = body.children[i];
						if (!child.classList || !child.classList.contains('card')) continue;
						if (child.classList.contains('dragging')) continue;
						out.push(child);
					}
					return out;
				}

				/** Where the card would land in `columnId`, expressed in that
				 * column's FINAL order (the dragged card already removed from
				 * wherever it came from). Anchors on the card under the cursor
				 * when there is one - before it in its top half, after it in its
				 * bottom half - and otherwise scans the column's card midpoints,
				 * which is the empty-space-below-the-last-card case. */
				function insertionIndexAt(columnId, event) {
					var nodes = cardNodesIn(columnId);
					var clientY = event && typeof event.clientY === 'number' ? event.clientY : null;
					var target =
						event && event.target && typeof event.target.closest === 'function'
							? event.target.closest('.card')
							: null;
					for (var i = 0; i < nodes.length; i++) {
						if (nodes[i] !== target) continue;
						var rect = nodes[i].getBoundingClientRect();
						return clientY !== null && clientY < rect.top + rect.height / 2 ? i : i + 1;
					}
					if (clientY === null) return nodes.length;
					for (var k = 0; k < nodes.length; k++) {
						var bounds = nodes[k].getBoundingClientRect();
						if (clientY < bounds.top + bounds.height / 2) return k;
					}
					return nodes.length;
				}

				function showPlaceholder(columnId, index) {
					var body = columnBodies[columnId];
					if (!body) return;
					var nodes = cardNodesIn(columnId);
					var el = placeholderElement();
					if (index < nodes.length) body.insertBefore(el, nodes[index]);
					else body.appendChild(el);
				}

				function markDragTargets() {
					Object.keys(columnNodes).forEach(function (columnId) {
						var legal = !!dragState && dragState.legal.indexOf(columnId) !== -1;
						columnNodes[columnId].classList.toggle('drop-legal', legal);
						columnNodes[columnId].classList.toggle('drop-illegal', !legal);
					});
				}

				function clearDragVisuals() {
					removePlaceholder();
					Object.keys(columnNodes).forEach(function (columnId) {
						columnNodes[columnId].classList.remove('drop-legal');
						columnNodes[columnId].classList.remove('drop-illegal');
					});
					Object.keys(cardNodes).forEach(function (key) {
						cardNodes[key].classList.remove('dragging');
					});
				}

				function endDrag() {
					clearDragVisuals();
					dragState = null;
					dragEndedAt = Date.now();
				}

				/** Escape, or the engine's own drag cancel: the card goes back
				 * where it was, which is just "re-render the snapshot" - an
				 * optimistic move is only ever applied once a drop lands. */
				function cancelDrag() {
					if (!dragState) return;
					endDrag();
					render(currentSnapshot);
					flushDeferredSnapshot();
				}

				function flushDeferredSnapshot() {
					if (dragState || deferredSnapshot === null) return;
					var next = deferredSnapshot;
					deferredSnapshot = null;
					render(reconcile(next));
				}

				/** A copy of `snapshot` with `move` applied: the card pulled out of
				 * whatever column holds it and spliced into `toColumnId` at
				 * `toIndex`. The incoming object is never mutated, so the sandbox's
				 * own snapshot stays intact for the next reconcile. */
				function projectMove(snapshot, move) {
					var located = locateCard(snapshot, move.key);
					if (!located || !columnById(snapshot, move.toColumnId)) return snapshot;
					var columns = snapshotColumns(snapshot).map(function (column) {
						var copy = {};
						Object.keys(column).forEach(function (field) {
							copy[field] = column[field];
						});
						copy.cards = Array.isArray(column.cards) ? column.cards.slice() : [];
						return copy;
					});
					var card = null;
					var target = null;
					columns.forEach(function (column) {
						if (column.id === located.columnId) card = column.cards.splice(located.index, 1)[0];
						if (column.id === move.toColumnId) target = column;
					});
					if (!card || !target) return snapshot;
					var index = Math.max(0, Math.min(move.toIndex, target.cards.length));
					target.cards.splice(index, 0, card);
					var out = {};
					Object.keys(snapshot).forEach(function (field) {
						out[field] = snapshot[field];
					});
					out.columns = columns;
					return out;
				}

				function rejectionMessage(rejection) {
					var reason =
						rejection && typeof rejection.reason === 'string' && rejection.reason
							? rejection.reason
							: 'the board rejected it';
					return 'Move not applied: ' + reason;
				}

				/** Folds an incoming snapshot together with the outstanding
				 * optimistic move. The sandbox is the authority: once its snapshot
				 * shows the card on the target column the pending move is settled,
				 * and a `moveRejection` naming that card puts the card back where
				 * the sandbox says it is and explains why. Until either happens the
				 * optimistic position is kept, so an unrelated snapshot (a status
				 * change landing between the drop and the move's own push) cannot
				 * make the card jump back and then forward again. */
				function reconcile(snapshot) {
					if (!pendingMove) return snapshot;
					var rejection = snapshot && snapshot.moveRejection ? snapshot.moveRejection : null;
					if (rejection && rejection.cardKey === pendingMove.key) {
						showToast(rejectionMessage(rejection));
						pendingMove = null;
						return snapshot;
					}
					if (Date.now() - pendingMove.at > PENDING_MOVE_TTL_MS) {
						pendingMove = null;
						return snapshot;
					}
					var located = locateCard(snapshot, pendingMove.key);
					if (!located || located.columnId === pendingMove.toColumnId) {
						pendingMove = null;
						return snapshot;
					}
					return projectMove(snapshot, pendingMove);
				}

				function onCardDragStart(event, card) {
					var located = locateCard(currentSnapshot, card.key);
					dragState = {
						key: card.key,
						fromColumnId: located ? located.columnId : null,
						fromIndex: located ? located.index : 0,
						legal: legalColumnIdsFor(currentSnapshot, card),
						toColumnId: null,
						toIndex: null,
					};
					if (event.dataTransfer) {
						try {
							event.dataTransfer.setData(DRAG_MIME, card.key);
							event.dataTransfer.setData('text/plain', card.key);
						} catch (err) {
							// Some engines refuse a custom type mid-drag; the drag
							// still works, since dragState carries the payload.
						}
						event.dataTransfer.effectAllowed = 'move';
					}
					if (cardNodes[card.key]) cardNodes[card.key].classList.add('dragging');
					markDragTargets();
				}

				function onColumnDragOver(event, columnId) {
					if (!dragState) return;
					if (dragState.legal.indexOf(columnId) === -1) {
						// Deliberately no preventDefault: an illegal column refuses
						// the drop, and no insertion line appears over a column that
						// could not take the card anyway.
						return;
					}
					event.preventDefault();
					if (event.dataTransfer) event.dataTransfer.dropEffect = 'move';
					var index = insertionIndexAt(columnId, event);
					dragState.toColumnId = columnId;
					dragState.toIndex = index;
					showPlaceholder(columnId, index);
				}

				function onColumnDragLeave(event, columnId, columnNode) {
					if (!dragState || dragState.toColumnId !== columnId) return;
					// dragleave also fires when the cursor crosses into one of the
					// column's own children, which is not leaving the column.
					if (event.relatedTarget && columnNode.contains(event.relatedTarget)) return;
					dragState.toColumnId = null;
					dragState.toIndex = null;
					removePlaceholder();
				}

				function onColumnDrop(event, columnId) {
					if (!dragState) return;
					if (dragState.legal.indexOf(columnId) === -1) return;
					event.preventDefault();
					var key = dragState.key;
					var fromColumnId = dragState.fromColumnId;
					var fromIndex = dragState.fromIndex;
					var toIndex =
						dragState.toColumnId === columnId && typeof dragState.toIndex === 'number'
							? dragState.toIndex
							: insertionIndexAt(columnId, event);
					endDrag();
					if (columnId === fromColumnId && toIndex === fromIndex) {
						// Dropped back on its own slot: not a move, so nothing is
						// posted and the sandbox is never asked to write a no-op.
						render(currentSnapshot);
						flushDeferredSnapshot();
						return;
					}
					commitMove(key, columnId, toIndex);
				}

				/** Applies a move optimistically and posts it. The single path a
				 * drop and a keyboard move share, so the `move` payload the sandbox
				 * sees is byte-identical whichever one produced it and the two can
				 * never drift apart. `toIndex` is an insertion point in the target
				 * column's FINAL order, with the moved card already removed from
				 * wherever it came from. */
				function commitMove(key, toColumnId, toIndex) {
					pendingMove = { key: key, toColumnId: toColumnId, toIndex: toIndex, at: Date.now() };
					var boardId = boardIdOf(currentSnapshot);
					render(projectMove(currentSnapshot, pendingMove));
					parent.postMessage(
						{
							type: 'maestro:invokeCommand',
							commandId: 'move',
							args: {
								cardKey: key,
								toColumnId: toColumnId,
								toIndex: toIndex,
								boardId: boardId,
							},
						},
						'*'
					);
					flushDeferredSnapshot();
				}

				function cardElement(card) {
					var el = document.createElement('div');
					el.className = 'card';
					if (typeof card.key === 'string' && card.key !== '') {
						cardNodes[card.key] = el;
						el.draggable = true;
						// Focusable so the keyboard's selection can take real focus
						// (which is what scrolls it into view and announces it), but
						// NOT tab-reachable: the board is navigated with the arrow
						// keys, not by tabbing through every card. A tabindex is safe
						// on a draggable surface - it is a form CONTROL that kills an
						// HTML5 drag, not focusability.
						el.tabIndex = -1;
						el.addEventListener('dragstart', function (event) {
							onCardDragStart(event, card);
						});
						el.addEventListener('dragend', function () {
							// Fires for a cancelled drag too (Escape, or a drop on
							// nothing), so this is the catch-all that returns the card.
							if (dragState) cancelDrag();
						});
					}

					var title = document.createElement('div');
					title.className = 'card-title';
					var dot = document.createElement('span');
					dot.className = 'status-dot';
					dot.style.background = statusColor(card.status);
					title.appendChild(dot);
					var titleText = document.createElement('span');
					titleText.textContent = card.title || 'Untitled';
					title.appendChild(titleText);
					el.appendChild(title);

					var meta = document.createElement('div');
					meta.className = 'card-meta';
					var project = document.createElement('span');
					project.className = 'card-project';
					project.textContent = [card.agentId, basename(card.projectPath)]
						.filter(Boolean)
						.join(' | ');
					meta.appendChild(project);
					var activity = document.createElement('span');
					activity.className = 'card-activity';
					activity.textContent = relativeTime(card.lastActivityAt);
					meta.appendChild(activity);
					el.appendChild(meta);

					el.addEventListener('click', function () {
						if (Date.now() - dragEndedAt < CLICK_AFTER_DRAG_MS) return;
						// Clicking is also pointing: arrowing on from the card you
						// just clicked is the obvious next move.
						selectCard(card.key);
						focusCard(card);
					});

					return el;
				}

				function renderBanner(snapshot) {
					var banner = document.getElementById('banner');
					var boardError = snapshot && snapshot.boardError;
					banner.textContent = '';
					banner.className = '';
					if (boardError && typeof boardError.message === 'string') {
						banner.hidden = false;
						var message = document.createElement('span');
						message.textContent = 'Board file failed to parse: ' + boardError.message;
						banner.appendChild(message);
						if (typeof boardError.path === 'string' && boardError.path) {
							var pathEl = document.createElement('span');
							pathEl.className = 'banner-path';
							pathEl.textContent = boardError.path;
							banner.appendChild(pathEl);
						}
						return;
					}
					// A Global board with no ~/.maestro/kanban.yaml has no columns to
					// project onto, so every card lands in Unmapped. That is correct
					// and looks broken, which is exactly when to say why.
					if (snapshot && snapshot.globalBoardMissing === true) {
						banner.hidden = false;
						banner.className = 'banner-notice';
						var notice = document.createElement('span');
						notice.textContent =
							'No global board yet, so nothing is mapped. Create ~/.maestro/kanban.yaml with the global columns, then point each project column at one with maps_to.';
						banner.appendChild(notice);
						return;
					}
					banner.hidden = true;
				}

				// -------------------------------------------------------------
				// Phase 03 board switcher. The sandbox owns the selection (it is
				// what remembers it in plugin storage), so the control posts
				// `select-board` and waits for the snapshot that comes back rather
				// than guessing which cards the new board holds.
				// -------------------------------------------------------------

				/** The option list last written into the <select>, so a background
				 * snapshot push does not rebuild an identical list out from under an
				 * open dropdown. */
				var renderedBoardsSignature = null;

				function boardsOf(snapshot) {
					return snapshot && Array.isArray(snapshot.boards) ? snapshot.boards : [];
				}

				function boardOptionLabel(board, count) {
					var name =
						board && typeof board.name === 'string' && board.name ? board.name : String(board.id);
					return name + ' (' + count + ')';
				}

				function cardCountOf(snapshot) {
					return snapshotColumns(snapshot).reduce(function (sum, column) {
						return sum + (column && Array.isArray(column.cards) ? column.cards.length : 0);
					}, 0);
				}

				/** Every board the switcher offers, in the sandbox's order. The board
				 * on screen is always one of them: before any agent has been
				 * activated the panel is on the unnamed "all agents" board, which the
				 * sandbox reports as a null id and does not list, so it is prepended
				 * here - a selection missing from the control it was made in would
				 * leave the user unable to name or leave the board they are looking
				 * at. */
				function switcherEntries(snapshot) {
					var entries = boardsOf(snapshot).map(function (board) {
						return {
							id: typeof board.id === 'string' ? board.id : '',
							label: boardOptionLabel(
								board,
								typeof board.cardCount === 'number' ? board.cardCount : 0
							),
							title: typeof board.projectPath === 'string' ? board.projectPath : '',
						};
					});
					if (boardIdOf(snapshot) === null) {
						entries.unshift({
							id: '',
							label: boardOptionLabel(
								{ name: snapshot && snapshot.boardName, id: '' },
								cardCountOf(snapshot)
							),
							title: '',
						});
					}
					// The sandbox caps how many projects ride in a snapshot. Saying
					// so is the difference between a capped list and a wrong one.
					var hidden = snapshot && snapshot.boardsHidden;
					if (typeof hidden === 'number' && hidden > 0) {
						entries.push({
							id: '',
							label: hidden + ' more project' + (hidden === 1 ? '' : 's') + ' not shown',
							title: '',
							disabled: true,
						});
					}
					return entries;
				}

				function renderHeader(snapshot) {
					var nameEl = document.getElementById('board-name');
					var countEl = document.getElementById('board-count');
					var select = document.getElementById('board-switcher');
					if (!nameEl || !countEl || !select) return;

					var name =
						snapshot && typeof snapshot.boardName === 'string' && snapshot.boardName
							? snapshot.boardName
							: 'Kanban Board';
					var count = cardCountOf(snapshot);
					nameEl.textContent = name;
					nameEl.title = snapshot && snapshot.activeProjectPath ? snapshot.activeProjectPath : '';
					countEl.textContent = count === 1 ? '1 card' : count + ' cards';

					var entries = switcherEntries(snapshot);
					var selectedId = boardIdOf(snapshot) === null ? '' : boardIdOf(snapshot);
					var signature = entries
						.map(function (entry) {
							return entry.id + '\u0001' + entry.label;
						})
						.join('\u0002');
					if (signature !== renderedBoardsSignature) {
						renderedBoardsSignature = signature;
						select.textContent = '';
						entries.forEach(function (entry) {
							var option = document.createElement('option');
							option.value = entry.id;
							option.textContent = entry.label;
							if (entry.disabled) option.disabled = true;
							// Two projects can share a basename; the full path tells them
							// apart without widening the control.
							if (entry.title) option.title = entry.title;
							select.appendChild(option);
						});
					}
					select.value = selectedId;
				}

				function onBoardSwitcherChange(event) {
					parent.postMessage(
						{
							type: 'maestro:invokeCommand',
							commandId: 'select-board',
							args: { boardId: event.target.value },
						},
						'*'
					);
				}

				// -------------------------------------------------------------
				// Phase 03 keyboard access. A board that only works with a mouse is
				// half a board, so every pointer affordance has a key:
				//
				//   Arrow keys         move the selection between cards and columns
				//   Enter              opens the selected card's tab
				//   Alt + Left/Right   moves the selected card one column over
				//   Escape             closes the panel (cancels a live drag first)
				//
				// Alt is the modifier because the alternatives are taken: Cmd or
				// Ctrl plus an arrow is an OS or browser binding, and Shift plus an
				// arrow is text selection. The keyboard move runs the SAME legality
				// check a drag does (legalColumnIdsFor) and goes through the SAME
				// commitMove(), so the sandbox cannot tell a keyboard move from a
				// drop and the two cannot diverge.
				// -------------------------------------------------------------

				/** Key of the card the keyboard is pointing at, or null. The
				 * selection follows the card BY KEY across re-renders, so an
				 * incoming snapshot or an optimistic move does not drop it. */
				var selectedKey = null;

				/** The board as the keyboard sees it: the rendered columns, each
				 * carrying the cards actually drawn in it, in display order. Reading
				 * the same renderableCards() render() does is what keeps the
				 * keyboard from selecting a card that is not on screen. */
				function keyboardGrid() {
					var grid = [];
					snapshotColumns(currentSnapshot).forEach(function (column) {
						if (!column || typeof column.id !== 'string') return;
						grid.push({
							id: column.id,
							title: typeof column.title === 'string' && column.title ? column.title : column.id,
							cards: renderableCards(column),
						});
					});
					return grid;
				}

				function locateSelection(grid) {
					for (var i = 0; i < grid.length; i++) {
						for (var j = 0; j < grid[i].cards.length; j++) {
							if (grid[i].cards[j].key === selectedKey) return { col: i, row: j };
						}
					}
					return null;
				}

				/** Paints the selection, and on `reveal` gives the card real focus
				 * so the engine scrolls it into view and a screen reader announces
				 * it. A selection whose card is gone (closed tab, board switch) is
				 * dropped rather than left pointing at nothing. */
				function applySelection(options) {
					if (selectedKey !== null && !cardNodes[selectedKey]) selectedKey = null;
					Object.keys(cardNodes).forEach(function (key) {
						var selected = key === selectedKey;
						cardNodes[key].classList.toggle('selected', selected);
						cardNodes[key].setAttribute('aria-selected', selected ? 'true' : 'false');
					});
					var node = selectedKey !== null ? cardNodes[selectedKey] : null;
					if (!node || !options || options.reveal !== true) return;
					if (typeof node.focus === 'function') node.focus();
					// jsdom has no scrollIntoView, and an older engine may not either.
					if (typeof node.scrollIntoView === 'function') node.scrollIntoView({ block: 'nearest' });
				}

				function selectCard(key) {
					selectedKey = typeof key === 'string' && key !== '' ? key : null;
					applySelection({ reveal: true });
				}

				/** Arrow-key selection. Up/Down walk the column; Left/Right cross to
				 * the nearest column in that direction THAT HAS CARDS, skipping the
				 * empty ones - a column with nothing in it has nothing to select, and
				 * stopping on it would read as a dead key. Neither direction wraps, so
				 * the edge of the board is a wall rather than a teleport to the far
				 * side. With nothing selected yet, the first press lands on the first
				 * card on the board. */
				function moveSelection(columnDelta, rowDelta) {
					var grid = keyboardGrid();
					var at = locateSelection(grid);
					if (!at) {
						for (var i = 0; i < grid.length; i++) {
							if (grid[i].cards.length === 0) continue;
							selectCard(grid[i].cards[0].key);
							return;
						}
						return;
					}
					if (rowDelta !== 0) {
						var row = at.row + rowDelta;
						var column = grid[at.col];
						if (row < 0 || row >= column.cards.length) return;
						selectCard(column.cards[row].key);
						return;
					}
					for (var c = at.col + columnDelta; c >= 0 && c < grid.length; c += columnDelta) {
						if (grid[c].cards.length === 0) continue;
						selectCard(grid[c].cards[Math.min(at.row, grid[c].cards.length - 1)].key);
						return;
					}
				}

				/** Alt + Left/Right: the selected card moves one column over,
				 * through the drag's own legality check. The ADJACENT column is the
				 * target even when it is illegal - skipping ahead to the next legal
				 * one would move the card two columns on a single key press - and an
				 * illegal one says so in a toast rather than eating the key, since a
				 * dead key and a broken board look identical from the outside. */
				function moveSelectedCard(columnDelta) {
					var grid = keyboardGrid();
					var at = locateSelection(grid);
					if (!at) return;
					var card = grid[at.col].cards[at.row];
					var target = grid[at.col + columnDelta];
					if (!target) return;
					if (legalColumnIdsFor(currentSnapshot, card).indexOf(target.id) === -1) {
						showToast('Cannot move "' + (card.title || 'that card') + '" to ' + target.title + '.');
						return;
					}
					// The same vertical slot in the new column, so the card reads as
					// sliding sideways. It is an insertion point in the target's final
					// order, exactly as a drop reports one.
					commitMove(card.key, target.id, Math.min(at.row, target.cards.length));
					applySelection({ reveal: true });
				}

				/** Jumps Maestro to the tab behind a card. Shared by the click and
				 * by Enter, so the two post the identical `focus` command. */
				function focusCard(card) {
					parent.postMessage(
						{
							type: 'maestro:invokeCommand',
							commandId: 'focus',
							args: { sessionId: card.sessionId, tabId: card.tabId },
						},
						'*'
					);
				}

				/** Escape with no drag in flight closes the panel. The panel cannot
				 * close itself - the bridge carries commands only, one way - so the
				 * sandbox does it with maestro.ui.closePanel(), which the board's
				 * `modal` placement is what makes legal. */
				function requestClosePanel() {
					parent.postMessage(
						{ type: 'maestro:invokeCommand', commandId: 'close-panel', args: {} },
						'*'
					);
				}

				/** Does this keystroke belong to a control that owns these keys
				 * itself? The board switcher is a <select>: arrows change its value
				 * and Enter commits it, so the board must not also act on them. */
				function ownsItsOwnKeys(target) {
					if (!target || typeof target.tagName !== 'string') return false;
					var tag = target.tagName.toLowerCase();
					return tag === 'select' || tag === 'input' || tag === 'textarea' || tag === 'button';
				}

				function render(snapshot) {
					currentSnapshot = snapshot || null;
					renderHeader(snapshot);
					renderBanner(snapshot);

					var board = document.getElementById('board');
					board.innerHTML = '';
					// Node maps are rebuilt from scratch: every element they point
					// at was just discarded with board.innerHTML.
					cardNodes = Object.create(null);
					columnNodes = Object.create(null);
					columnBodies = Object.create(null);

					var columns = snapshot && Array.isArray(snapshot.columns) ? snapshot.columns : [];
					var totalCards = columns.reduce(function (sum, column) {
						return sum + (column && Array.isArray(column.cards) ? column.cards.length : 0);
					}, 0);

					if (totalCards === 0) {
						var empty = document.createElement('div');
						empty.className = 'empty-state';
						var emptyText = document.createElement('div');
						emptyText.textContent =
							'No agents yet. Open an AI tab in Maestro to see it appear here.';
						empty.appendChild(emptyText);
						if (
							snapshot &&
							snapshot.projectBoardMissing === true &&
							typeof snapshot.activeProjectPath === 'string' &&
							snapshot.activeProjectPath
						) {
							var writeButton = document.createElement('button');
							writeButton.type = 'button';
							writeButton.className = 'write-default-board-button';
							writeButton.textContent = 'Write default board for this project';
							writeButton.addEventListener('click', function () {
								parent.postMessage(
									{
										type: 'maestro:invokeCommand',
										commandId: 'write-default-board',
										args: { projectPath: snapshot.activeProjectPath },
									},
									'*'
								);
							});
							empty.appendChild(writeButton);
						}
						board.appendChild(empty);
						// No cards left to point at, so the selection is dropped
						// rather than left naming a card nobody can see.
						applySelection();
						return;
					}

					columns.forEach(function (column) {
						if (!column || typeof column.id !== 'string') return;
						var cards = Array.isArray(column.cards) ? column.cards : [];
						var wipLimit = typeof column.wipLimit === 'number' ? column.wipLimit : undefined;
						var overLimit = typeof wipLimit === 'number' && cards.length > wipLimit;

						var col = document.createElement('div');
						col.className = column.readOnly === true ? 'column read-only' : 'column';
						columnNodes[column.id] = col;
						if (column.readOnly !== true) {
							col.addEventListener('dragover', function (event) {
								onColumnDragOver(event, column.id);
							});
							col.addEventListener('drop', function (event) {
								onColumnDrop(event, column.id);
							});
							col.addEventListener('dragleave', function (event) {
								onColumnDragLeave(event, column.id, col);
							});
						}

						var header = document.createElement('div');
						header.className = 'column-header';
						var label = document.createElement('span');
						label.textContent = typeof column.title === 'string' ? column.title : column.id;
						header.appendChild(label);
						var count = document.createElement('span');
						count.className = overLimit ? 'column-count over-limit' : 'column-count';
						count.textContent = String(cards.length);
						header.appendChild(count);
						col.appendChild(header);

						var body = document.createElement('div');
						body.className = 'column-body';
						columnBodies[column.id] = body;
						renderableCards(column).forEach(function (card) {
							body.appendChild(cardElement(card));
						});
						col.appendChild(body);

						board.appendChild(col);
					});

					// Every node the selection pointed at was just discarded with
					// board.innerHTML, so the class is re-applied to the new one.
					applySelection();

					// A drag is still live only when render() was called to put a
					// cancelled card back; re-apply the dim/highlight so the
					// rebuilt columns are not left looking inert mid-drag.
					if (dragState) markDragTargets();
				}

				document.addEventListener('keydown', function (event) {
					if (event.key === 'Escape') {
						event.preventDefault();
						event.stopPropagation();
						// A live drag owns Escape: it cancels the drag and the panel
						// stays open, so one key press never does both.
						if (dragState) cancelDrag();
						else requestClosePanel();
						return;
					}
					// Mid-drag the pointer owns the board; only Escape applies.
					if (dragState) return;
					if (ownsItsOwnKeys(event.target)) return;
					// Cmd/Ctrl combinations belong to the OS and the engine.
					if (event.metaKey || event.ctrlKey) return;

					if (event.key === 'Enter') {
						var grid = keyboardGrid();
						var at = locateSelection(grid);
						if (!at) return;
						event.preventDefault();
						focusCard(grid[at.col].cards[at.row]);
						return;
					}
					if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
						var columnDelta = event.key === 'ArrowLeft' ? -1 : 1;
						event.preventDefault();
						if (event.altKey) moveSelectedCard(columnDelta);
						else moveSelection(columnDelta, 0);
						return;
					}
					if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
						// Alt is the move modifier, and only left/right move a card:
						// a stored order is a position inside one column, but which
						// column a card sits in is the thing a board is about. So
						// Alt+Up/Down is left unclaimed rather than given a meaning
						// the task did not ask for.
						if (event.altKey) return;
						event.preventDefault();
						moveSelection(0, event.key === 'ArrowUp' ? -1 : 1);
						return;
					}
				});

				var toastEl = document.getElementById('toast');
				if (toastEl) toastEl.addEventListener('click', hideToast);

				// The <select> is static markup, never replaced by a render, so the
				// listener is bound once here rather than per snapshot.
				var switcherEl = document.getElementById('board-switcher');
				if (switcherEl) switcherEl.addEventListener('change', onBoardSwitcherChange);

				window.addEventListener('message', function (event) {
					if (event.data && event.data.type === 'maestro:panelData') {
						if (dragState) {
							// Never re-render under the cursor: the snapshot is held
							// until the drag ends (flushDeferredSnapshot).
							deferredSnapshot = event.data.data;
							return;
						}
						render(reconcile(event.data.data));
					}
				});
			})();
		</script>
	</body>
</html>
